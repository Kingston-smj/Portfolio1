<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="cit cid">
  <title id="cit">ClipIt preview</title>
  <desc id="cid">Looping re-creation of the real ClipIt history popup: the blue selection walks down the clipboard entries like pressing the shortcut repeatedly.</desc>
  <style>
    .ci-ui { font-family: system-ui, -apple-system, sans-serif; }
    .ci-entry { fill: #cdd6f4; font-size: 13px; }
    .ci-sub { fill: #cdd6f4; opacity: .72; font-size: 11px; }
    .ci-mono { font-family: ui-monospace, monospace; fill: #cdd6f4; font-size: 12px; }
    .ci-sel {
      fill: #45475a;
      opacity: 0;
      animation: ci-sel 6s linear infinite;
    }
    @keyframes ci-sel {
      0%, 10% { opacity: 1; }
      20%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ci-sel { animation: none; opacity: 1; }
    }
  </style>

  <rect x="40" y="14" width="320" height="222" rx="10" fill="#181825" stroke="#313244"/>
  <path d="M40 24a10 10 0 0 1 10-10h300a10 10 0 0 1 10 10v26H40V24z" fill="#1e1e2e"/>
  <text class="ci-ui" x="56" y="33" font-size="14" font-weight="700" fill="#cdd6f4">ClipIt</text>

  <g class="ci-ui">
    <rect class="ci-sel" x="46" y="52" width="308" height="34" rx="8" style="animation-delay:0s"/>
    <text class="ci-entry" x="56" y="73">The idea you copied a moment ago.</text>

    <rect class="ci-sel" x="46" y="90" width="308" height="34" rx="8" style="animation-delay:1.5s"/>
    <text class="ci-entry" x="56" y="111">Hey! Here&#8217;s the update you asked for.</text>

    <rect class="ci-sel" x="46" y="128" width="308" height="34" rx="8" style="animation-delay:3s"/>
    <text class="ci-entry" x="56" y="143">Meeting notes</text>
    <text class="ci-sub" x="56" y="157">Keep the idea. Pick it up later.</text>

    <rect class="ci-sel" x="46" y="166" width="308" height="34" rx="8" style="animation-delay:4.5s"/>
    <text class="ci-mono" x="56" y="187">cmake --build build</text>
  </g>

  <rect x="40" y="206" width="320" height="30" fill="#11111b"/>
  <g fill="#6c7086" stroke="none">
    <g transform="translate(92 221)">
      <rect x="-5" y="-6" width="10" height="12" rx="2" fill="none" stroke="#8f9aa8" stroke-width="1.6"/>
      <rect x="-2.5" y="-8.5" width="5" height="3" rx="1" fill="none" stroke="#8f9aa8" stroke-width="1.4"/>
    </g>
    <g transform="translate(164 221)" fill="none" stroke="#8f9aa8" stroke-width="1.6" stroke-linecap="round">
      <circle r="6.5"/>
      <circle cx="-2.4" cy="-1.6" r="0.9" fill="#8f9aa8" stroke="none"/>
      <circle cx="2.4" cy="-1.6" r="0.9" fill="#8f9aa8" stroke="none"/>
      <path d="M-2.8 2a4.4 4.4 0 0 0 5.6 0"/>
    </g>
    <text class="ci-ui" x="236" y="225.5" font-size="11" text-anchor="middle" fill="#8f9aa8">:-)</text>
    <text class="ci-ui" x="308" y="226" font-size="13" text-anchor="middle" fill="#8f9aa8">&#937;</text>
  </g>
  <rect x="76" y="230" width="32" height="3" rx="1.5" fill="#89b4fa"/>
</svg>
