<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="cit cid">
  <title id="cit">ClipIt preview</title>
  <desc id="cid">Animated mock of the ClipIt clipboard history popup: a highlight cycles through history rows and a pin appears, on a clay panel.</desc>
  <style>
    .ci-flash {
      fill: #FFFFFF;
      fill-opacity: 0;
      animation: ci-flash 4s ease-in-out infinite;
    }
    @keyframes ci-flash {
      0%, 20% { fill-opacity: .25; }
      25%, 100% { fill-opacity: 0; }
    }
    .ci-pin {
      opacity: 0;
      animation: ci-pin 4s ease-in-out infinite;
    }
    @keyframes ci-pin {
      0%, 24% { opacity: 0; }
      30%, 100% { opacity: 1; }
    }
    .ci-scroll {
      transform-box: fill-box;
      animation: ci-scroll 4.5s ease-in-out infinite;
    }
    @keyframes ci-scroll {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(96px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ci-flash, .ci-pin, .ci-scroll { animation: none; }
      .ci-flash { fill-opacity: 0; }
      .ci-pin { opacity: 1; }
    }
  </style>

  <rect width="400" height="250" rx="18" fill="#D27851"/>

  <rect x="58" y="34" width="284" height="184" rx="12" fill="#FFFFFF" fill-opacity=".16" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="76" cy="50" r="3.5" fill="#FFFFFF" opacity=".9"/>
  <circle cx="90" cy="50" r="3.5" fill="#FFFFFF" opacity=".55"/>
  <circle cx="104" cy="50" r="3.5" fill="#FFFFFF" opacity=".3"/>

  <g fill="#FFFFFF">
    <rect x="330" y="66" width="4" height="34" rx="2" class="ci-scroll" opacity=".5"/>
  </g>

  <rect x="72" y="64" width="250" height="30" rx="8" fill="#FFFFFF" fill-opacity=".09"/>
  <rect x="72" y="64" width="250" height="30" rx="8" class="ci-flash"/>
  <circle cx="88" cy="79" r="6" fill="#FFFFFF" opacity=".85"/>
  <rect x="102" y="72" width="124" height="5" rx="2.5" fill="#FFFFFF" opacity=".9"/>
  <rect x="102" y="82" width="78" height="5" rx="2.5" fill="#FFFFFF" opacity=".45"/>

  <rect x="72" y="102" width="250" height="30" rx="8" fill="#FFFFFF" fill-opacity=".09"/>
  <rect x="72" y="102" width="250" height="30" rx="8" class="ci-flash" style="animation-delay:1s"/>
  <circle cx="88" cy="117" r="6" fill="#FFFFFF" opacity=".85"/>
  <rect x="102" y="110" width="140" height="5" rx="2.5" fill="#FFFFFF" opacity=".9"/>
  <rect x="102" y="120" width="64" height="5" rx="2.5" fill="#FFFFFF" opacity=".45"/>
  <g class="ci-pin" style="animation-delay:1s">
    <path d="M312 110l8 8-3.2.9-4.1 4.1-.9-3.2-4.1 4.1-1.3-1.3 4.1-4.1-.9-3.2 2.4-5.3z" fill="#FFFFFF"/>
  </g>

  <rect x="72" y="140" width="250" height="30" rx="8" fill="#FFFFFF" fill-opacity=".09"/>
  <rect x="72" y="140" width="250" height="30" rx="8" class="ci-flash" style="animation-delay:2s"/>
  <circle cx="88" cy="155" r="6" fill="#FFFFFF" opacity=".85"/>
  <rect x="102" y="148" width="112" height="5" rx="2.5" fill="#FFFFFF" opacity=".9"/>
  <rect x="102" y="158" width="84" height="5" rx="2.5" fill="#FFFFFF" opacity=".45"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <path d="M306 150h8m-2-2v4"/>
  </g>

  <rect x="72" y="178" width="250" height="30" rx="8" fill="#FFFFFF" fill-opacity=".09"/>
  <rect x="72" y="178" width="250" height="30" rx="8" class="ci-flash" style="animation-delay:3s"/>
  <circle cx="88" cy="193" r="6" fill="#FFFFFF" opacity=".85"/>
  <rect x="102" y="186" width="132" height="5" rx="2.5" fill="#FFFFFF" opacity=".9"/>
  <rect x="102" y="196" width="58" height="5" rx="2.5" fill="#FFFFFF" opacity=".45"/>
</svg>
