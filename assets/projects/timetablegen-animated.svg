<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
    <defs>
        <clipPath id="clip">
            <rect x="0" y="0" width="400" height="250" rx="10" />
        </clipPath>
    </defs>
    <g clip-path="url(#clip)">
        <image id="img1" href="assets/projects/timetablegen/1.png" width="400" height="250" preserveAspectRatio="xMidYMid slice">
            <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.3;0.33" dur="8s" repeatCount="indefinite" begin="0s" />
        </image>
        <image id="img2" href="assets/projects/timetablegen/2.png" width="400" height="250" preserveAspectRatio="xMidYMid slice" opacity="0">
            <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.33;0.66" dur="8s" repeatCount="indefinite" begin="0s" />
        </image>
        <image id="img3" href="assets/projects/timetablegen/3.png" width="400" height="250" preserveAspectRatio="xMidYMid slice" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite" begin="0s" />
        </image>
        <!-- Simplified logic for the demo; in a real loop of 8, the timing would be 1/8th intervals. 
             To keep the SVG clean and performant for the browser, I'll use a standard CSS animation 
             pattern for the full set of 8 images instead if we want precise timing. 
             However, for the requested "animated svg that scrolls through", I will implement 
             the CSS approach in the HTML for the project card for better smoothness. -->
    </g>
</svg>