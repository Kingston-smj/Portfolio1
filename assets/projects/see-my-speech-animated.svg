<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="sst ssd">
  <title id="sst">See-My-Speech preview</title>
  <desc id="ssd">Animated mock of See-My-Speech: microphone record light pulses, a waveform oscillates, and transcript lines type themselves out on a blue panel.</desc>
  <style>
    .ss-rec {
      opacity: .35;
      animation: ss-rec 1.6s ease-in-out infinite;
    }
    @keyframes ss-rec {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
    .ss-wave {
      fill: #FFFFFF;
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: ss-wave 1.3s ease-in-out infinite;
    }
    @keyframes ss-wave {
      0%, 100% { transform: scaleY(.3); }
      50% { transform: scaleY(1); }
    }
    .ss-line {
      fill: #FFFFFF;
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: ss-line 6s ease-in-out infinite;
    }
    @keyframes ss-line {
      0%, 20% { transform: scaleX(0); opacity: 0; }
      30% { transform: scaleX(1); opacity: 1; }
      88% { transform: scaleX(1); opacity: 1; }
      96%, 100% { transform: scaleX(0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ss-rec, .ss-wave, .ss-line { animation: none; }
      .ss-rec, .ss-wave { opacity: .9; transform: none; }
      .ss-line { transform: none; opacity: .9; }
    }
  </style>

  <rect width="400" height="250" rx="18" fill="#3F79B5"/>

  <rect x="58" y="34" width="284" height="184" rx="12" fill="#FFFFFF" fill-opacity=".16" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="76" cy="50" r="3.5" fill="#FFFFFF" opacity=".9"/>
  <circle cx="90" cy="50" r="3.5" fill="#FFFFFF" opacity=".55"/>
  <circle cx="104" cy="50" r="3.5" fill="#FFFFFF" opacity=".3"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="92" y="66" width="16" height="30" rx="8"/>
    <path d="M84 84v3.5a16 16 0 0 0 32 0V84"/>
    <path d="M100 103.5v7"/>
    <path d="M92 112h16"/>
  </g>
  <circle class="ss-rec" cx="100" cy="81" r="4.5" fill="#FFFFFF"/>

  <g fill="#FFFFFF">
    <rect class="ss-wave" x="148" y="72" width="8" height="26" rx="4" style="animation-delay:-.06s"/>
    <rect class="ss-wave" x="172" y="72" width="8" height="26" rx="4" style="animation-delay:-.26s"/>
    <rect class="ss-wave" x="196" y="72" width="8" height="26" rx="4" style="animation-delay:-.46s"/>
    <rect class="ss-wave" x="220" y="72" width="8" height="26" rx="4" style="animation-delay:-.66s"/>
    <rect class="ss-wave" x="244" y="72" width="8" height="26" rx="4" style="animation-delay:-.86s"/>
    <rect class="ss-wave" x="268" y="72" width="8" height="26" rx="4" style="animation-delay:-1.06s"/>
    <rect class="ss-wave" x="292" y="72" width="8" height="26" rx="4" style="animation-delay:-.36s"/>
    <rect class="ss-wave" x="316" y="72" width="8" height="26" rx="4" style="animation-delay:-.56s"/>
  </g>

  <rect class="ss-line" x="92" y="126" width="216" height="7" rx="3.5" opacity=".9" style="animation-delay:0s"/>
  <rect class="ss-line" x="92" y="142" width="188" height="7" rx="3.5" opacity=".65" style="animation-delay:1s"/>
  <rect class="ss-line" x="92" y="158" width="232" height="7" rx="3.5" opacity=".9" style="animation-delay:2s"/>
  <rect class="ss-line" x="92" y="174" width="150" height="7" rx="3.5" opacity=".65" style="animation-delay:3s"/>
  <rect class="ss-line" x="92" y="190" width="118" height="7" rx="3.5" opacity=".45" style="animation-delay:4s"/>
</svg>
