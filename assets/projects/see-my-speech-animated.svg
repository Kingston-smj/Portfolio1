<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="sms smsd">
  <title id="sms">See-My-Speech preview</title>
  <desc id="smsd">Looping re-creation of the See-My-Speech Transcription tab: a file is selected, the language is detected, transcript lines stream in, and the save buttons enable.</desc>
  <style>
    .sms-ui { font-family: system-ui, sans-serif; }
    .w0 { animation: w0 7s linear infinite; }
    .wL { animation: wL 7s linear infinite; }
    .wB { animation: wB 7s linear infinite; }
    .wC { animation: wC 7s linear infinite; }
    @keyframes w0 {
      0%, 2% { opacity: 1; }
      3%, 95% { opacity: 0; }
      98%, 100% { opacity: 1; }
    }
    @keyframes wL {
      0%, 3% { opacity: 0; }
      4%, 97% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    @keyframes wB {
      0%, 40% { opacity: 0; }
      41%, 61% { opacity: 1; }
      63%, 100% { opacity: 0; }
    }
    @keyframes wC {
      0%, 61% { opacity: 0; }
      62%, 96% { opacity: 1; }
      99%, 100% { opacity: 0; }
    }
    .sms-spin {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: sms-spin 1.1s linear infinite;
    }
    @keyframes sms-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .w0 { opacity: 0; }
      .wL, .wC { animation: none; opacity: 1; }
      .wB { animation: none; opacity: 0; }
      .sms-spin { animation: none; }
    }
  </style>

  <rect width="400" height="250" rx="18" fill="#f5f5f5"/>
  <g class="sms-ui" font-size="10.5">
    <rect x="22" y="12" width="96" height="26" fill="#4CAF50"/>
    <text x="34" y="29" fill="#ffffff" font-weight="700">Transcription</text>
    <rect x="118" y="12" width="66" height="26" fill="#e1e1e1"/>
    <text x="132" y="29" fill="#444">History</text>
    <rect x="184" y="12" width="70" height="26" fill="#e1e1e1"/>
    <text x="198" y="29" fill="#444">Settings</text>
    <rect x="254" y="12" width="88" height="26" fill="#e1e1e1"/>
    <text x="268" y="29" fill="#444">System Info</text>
  </g>

  <g class="sms-ui">
    <rect x="22" y="48" width="356" height="56" rx="5" fill="none" stroke="#cccccc" stroke-width="2"/>
    <rect x="30" y="42" width="66" height="12" fill="#f5f5f5"/>
    <text x="34" y="52" font-size="10" font-weight="700" fill="#333">Audio File</text>
    <rect x="32" y="60" width="238" height="20" fill="#f9f9f9" stroke="#cccccc"/>
    <text class="w0" x="38" y="74" font-size="9.5" fill="#888">No file selected</text>
    <text class="wL" x="38" y="74" font-size="9.5" fill="#444">interview_recording.mp3</text>
    <rect x="288" y="60" width="80" height="20" rx="4" fill="#4CAF50"/>
    <text x="306" y="74" font-size="10" font-weight="700" fill="#fff">Browse</text>
    <text x="32" y="97" font-size="9.5" fill="#444">&#10004; Auto-detect&#8195;&#8195;&#10005; Translate&#8195;&#8195;&#10004; Include timestamps</text>
  </g>

  <g class="sms-ui">
    <rect x="22" y="112" width="186" height="26" rx="4" fill="#4CAF50"/>
    <text x="34" y="129" font-size="10.5" font-weight="700" fill="#ffffff">&#127919; Start Transcription</text>
    <rect x="218" y="112" width="66" height="26" rx="4" fill="#cccccc"/>
    <text x="232" y="129" font-size="10.5" fill="#666666">Cancel</text>
  </g>

  <g class="sms-ui">
    <rect x="22" y="148" width="356" height="90" rx="5" fill="none" stroke="#cccccc" stroke-width="2"/>
    <rect x="30" y="142" width="52" height="12" fill="#f5f5f5"/>
    <text x="34" y="152" font-size="10" font-weight="700" fill="#333">Results</text>

    <g font-size="9.5" fill="#444">
      <text class="w0" x="28" y="170">Language: Not detected</text>
      <g class="wB">
        <text x="28" y="170">Language: detecting...</text>
      </g>
      <g class="wC">
        <text x="28" y="170" font-weight="600" fill="#1a6b1d">Language: English (auto-detected)</text>
      </g>
    </g>

    <rect x="22" y="176" width="356" height="44" fill="#ffffff" stroke="#cccccc"/>
    <g font-family="ui-monospace, monospace" font-size="9.5">
      <g class="w0">
        <text x="30" y="192" fill="#888">Transcription will appear here...</text>
      </g>
      <g class="wB">
        <text x="30" y="192" fill="#444">detecting language...</text>
        <rect class="sms-spin" x="150" y="182" width="7" height="7" rx="3.5" fill="none" stroke="#4CAF50" stroke-width="1.6"/>
      </g>
      <g class="wC">
        <text x="30" y="192" fill="#333">[00:00:01.240 &#8594; 00:00:04.512] Good morning,</text>
        <text x="30" y="206" fill="#333">[00:00:04.615 &#8594; 00:00:09.030] and welcome to the standup.</text>
        <text x="30" y="220" fill="#333">[00:00:09.282 &#8594; 00:00:12.060] Two updates from the week.</text>
      </g>
    </g>

    <rect class="w0" x="30" y="212" width="78" height="18" rx="3" fill="#cccccc"/>
    <text class="w0" x="38" y="225" font-size="9.5" fill="#666">Save as TXT</text>
    <rect class="w0" x="114" y="212" width="112" height="18" rx="3" fill="#cccccc"/>
    <text class="w0" x="122" y="225" font-size="9.5" fill="#666">Copy to Clipboard</text>

    <g class="wC">
      <rect x="30" y="212" width="78" height="18" rx="3" fill="#4CAF50"/>
      <text x="38" y="225" font-size="9.5" font-weight="700" fill="#fff">Save as TXT</text>
      <rect x="114" y="212" width="112" height="18" rx="3" fill="#4CAF50"/>
      <text x="122" y="225" font-size="9.5" font-weight="700" fill="#fff">Copy to Clipboard</text>
    </g>
  </g>
</svg>
