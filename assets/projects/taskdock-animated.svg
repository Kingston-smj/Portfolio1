<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="tgt tgd">
  <title id="tgt">Taskdock preview</title>
  <desc id="tgd">Animated mock of the Taskdock job runner: jobs fill their progress bars and check off one after another on an indigo panel.</desc>
  <style>
    .td-bar {
      opacity: .92;
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: td-bar 6s ease-in-out infinite;
    }
    @keyframes td-bar {
      0% { transform: scaleX(0); }
      22% { transform: scaleX(1); }
      84% { transform: scaleX(1); }
      94%, 100% { transform: scaleX(0); }
    }
    .td-check {
      opacity: 0;
      animation: td-check 6s ease-in-out infinite;
    }
    @keyframes td-check {
      0%, 10% { opacity: 0; }
      24%, 84% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    .td-dot {
      opacity: .45;
      animation: td-dot 1.4s ease-in-out infinite;
    }
    @keyframes td-dot {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .td-bar, .td-check, .td-dot { animation: none; }
      .td-bar { opacity: .55; }
      .td-check, .td-dot { opacity: 1; }
    }
  </style>

  <rect width="400" height="250" rx="18" fill="#6B61B8"/>

  <rect x="58" y="34" width="284" height="184" rx="12" fill="#FFFFFF" fill-opacity=".16" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="76" cy="50" r="3.5" fill="#FFFFFF" opacity=".9"/>
  <circle cx="90" cy="50" r="3.5" fill="#FFFFFF" opacity=".55"/>
  <circle cx="104" cy="50" r="3.5" fill="#FFFFFF" opacity=".3"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="86" cy="88" r="7"/>
    <path class="td-check" d="M82.5 88l2.5 2.5 5-5" style="animation-delay:.5s"/>
    <circle cx="86" cy="132" r="7"/>
    <path class="td-check" d="M82.5 132l2.5 2.5 5-5" style="animation-delay:2.1s"/>
  </g>
  <circle class="td-dot" cx="86" cy="176" r="7" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <rect x="102" y="80" width="118" height="6" rx="3" fill="#FFFFFF" opacity=".9"/>
  <rect x="102" y="90" width="64" height="5" rx="2.5" fill="#FFFFFF" opacity=".4"/>
  <rect x="102" y="99" width="150" height="5" rx="2.5" fill="#FFFFFF" opacity=".2"/>
  <rect class="td-bar" x="102" y="99" width="150" height="5" rx="2.5" fill="#FFFFFF"/>

  <rect x="102" y="124" width="100" height="6" rx="3" fill="#FFFFFF" opacity=".9"/>
  <rect x="102" y="134" width="78" height="5" rx="2.5" fill="#FFFFFF" opacity=".4"/>
  <rect x="102" y="143" width="150" height="5" rx="2.5" fill="#FFFFFF" opacity=".2"/>
  <rect class="td-bar" x="102" y="143" width="150" height="5" rx="2.5" fill="#FFFFFF" style="animation-delay:1.6s"/>

  <rect x="102" y="168" width="128" height="6" rx="3" fill="#FFFFFF" opacity=".9"/>
  <rect x="102" y="178" width="70" height="5" rx="2.5" fill="#FFFFFF" opacity=".4"/>
  <rect x="102" y="187" width="150" height="5" rx="2.5" fill="#FFFFFF" opacity=".2"/>
  <rect class="td-bar" x="102" y="187" width="150" height="5" rx="2.5" fill="#FFFFFF" style="animation-delay:3.2s"/>
</svg>
