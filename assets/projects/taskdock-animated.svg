<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="tdt tdd">
  <title id="tdt">Taskdock preview</title>
  <desc id="tdd">Looping re-creation of a Taskdock terminal session: a smoke job is submitted with --wait, then the Prometheus metrics endpoint is read.</desc>
  <style>
    .tdc-mono { font-family: ui-monospace, monospace; font-size: 10.5px; }
    .tdc-cmd { fill: #e6e6e6; }
    .tdc-prompt { fill: #a6e3a1; }
    .tdc-key { fill: #7aa2f7; }
    .tdc-str { fill: #a6e3a1; }
    .tdc-num { fill: #e0af68; }
    .tdc-dim { fill: #7b8494; }
    .tdc-line {
      opacity: 0;
      animation: tdc-line 7s ease-in-out infinite;
    }
    @keyframes tdc-line {
      0%, 4% { opacity: 0; }
      8%, 88% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .tdc-cursor {
      opacity: 1;
      animation: tdc-cursor 1.1s steps(1) infinite;
    }
    @keyframes tdc-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tdc-line { animation: none; opacity: 1; }
      .tdc-cursor { animation: none; opacity: 1; }
    }
  </style>

  <rect width="400" height="250" rx="18" fill="#23272e"/>
  <rect x="0" y="0" width="400" height="26" fill="#191c22"/>
  <circle cx="20" cy="13" r="4" fill="#ff5f57"/>
  <circle cx="36" cy="13" r="4" fill="#febc2e"/>
  <circle cx="52" cy="13" r="4" fill="#28c840"/>

  <g class="tdc-mono">
    <g class="tdc-line" style="animation-delay:.1s">
      <text class="tdc-prompt" x="22" y="48">$</text>
      <text class="tdc-cmd" x="34" y="48">./bin/taskdock submit --kind smoke --key build-1 --wait</text>
    </g>
    <g class="tdc-line" style="animation-delay:.8s">
      <text x="30" y="68">{"<tspan class="tdc-key">job</tspan>":{"<tspan class="tdc-key">id</tspan>":<tspan class="tdc-num">1</tspan>,"<tspan class="tdc-key">kind</tspan>":"<tspan class="tdc-str">smoke</tspan>"</text>
    </g>
    <g class="tdc-line" style="animation-delay:1.1s">
      <text x="30" y="83">"<tspan class="tdc-key">state</tspan>":"<tspan class="tdc-str">succeeded</tspan>","<tspan class="tdc-key">exit</tspan>":<tspan class="tdc-num">0</tspan>}</text>
    </g>

    <g class="tdc-line" style="animation-delay:2s">
      <text class="tdc-prompt" x="22" y="108">$</text>
      <text class="tdc-cmd" x="34" y="108">./bin/taskdock metrics</text>
    </g>
    <g class="tdc-line" style="animation-delay:2.7s">
      <text class="tdc-dim" x="30" y="128"># HELP taskdock_jobs Retained jobs by current state.</text>
      <text x="30" y="145">taskdock_jobs{<tspan class="tdc-key">state</tspan>="<tspan class="tdc-str">queued</tspan>"} <tspan class="tdc-num">0</tspan></text>
    </g>
    <g class="tdc-line" style="animation-delay:3.3s">
      <text x="30" y="162">taskdock_jobs{<tspan class="tdc-key">state</tspan>="<tspan class="tdc-str">running</tspan>"} <tspan class="tdc-num">1</tspan></text>
    </g>
    <g class="tdc-line" style="animation-delay:3.9s">
      <text x="30" y="179">taskdock_jobs{<tspan class="tdc-key">state</tspan>="<tspan class="tdc-str">succeeded</tspan>"} <tspan class="tdc-num">2</tspan></text>
    </g>
    <g class="tdc-line" style="animation-delay:4.5s">
      <text x="30" y="196">taskdock_workers <tspan class="tdc-num">1</tspan></text>
    </g>

    <g class="tdc-line" style="animation-delay:5.2s">
      <text class="tdc-prompt" x="22" y="220">$</text>
      <rect class="tdc-cursor" x="34" y="211" width="6.5" height="12" fill="#e6e6e6"/>
      <text class="tdc-cursor" x="34" y="220"> </text>
    </g>
  </g>
</svg>
